name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross: false
          - target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Cross build
        if: matrix.cross
        run: cross build --release --locked --target "${{ matrix.target }}"

      - name: Package
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/tlx" "dist/tlx-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            strip "dist/tlx-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tlx-${{ matrix.target }}
          path: dist/tlx-${{ matrix.target }}

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          set -eu
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/tlx dist/tlx-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/tlx dist/tlx-x86_64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: tlx-macos
          path: dist/tlx-*

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum tlx-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tlx-*
            dist/SHA256SUMS
            install.sh
          generate_release_notes: true
