name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Cross build
        if: matrix.cross
        run: cross build --release --locked --target "${{ matrix.target }}"

      - name: Package
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/tlx" "dist/tlx-${{ matrix.target }}"
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            strip "dist/tlx-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tlx-${{ matrix.target }}
          path: dist/tlx-${{ matrix.target }}

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum tlx-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tlx-*
            dist/SHA256SUMS
            install.sh
          generate_release_notes: true
