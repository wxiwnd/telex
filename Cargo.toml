[package]
name = "telex"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Agent mailbox for local harnesses"

[lib]
name = "telex"
path = "src/lib.rs"

[[bin]]
name = "tlx"
path = "src/bin/tlx.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
